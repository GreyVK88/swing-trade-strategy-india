name: Run scanner

# Manual "Run workflow" button on the Actions tab. Also runs on a weekday
# morning schedule (commented out below) if you want it fully automatic.
on:
  workflow_dispatch:
    inputs:
      capital:
        description: "Account capital (INR) for position sizing"
        required: true
        default: "1000000"
      data_source:
        description: "sample = synthetic demo data | real_nse = fetch real data via jugaad-data"
        type: choice
        options:
          - sample
          - real_nse
        required: true
        default: sample
  # schedule:
  #   - cron: "30 3 * * 1-5"  # 09:00 IST, Mon-Fri (cron runs in UTC)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: pip install pyyaml

      - name: Generate sample data
        if: ${{ inputs.data_source == 'sample' }}
        run: python data/generate_sample_data.py

      - name: Install real-data dependencies
        if: ${{ inputs.data_source == 'real_nse' }}
        run: pip install jugaad-data pandas

      - name: Fetch real NSE data
        if: ${{ inputs.data_source == 'real_nse' }}
        run: python data/fetch_nse_data.py --symbols-config data/nse_symbols.yaml --out-dir data/real

      - name: Run scanner (sample data)
        if: ${{ inputs.data_source == 'sample' }}
        run: |
          python scanner/scanner.py \
            --config config/screening_config.yaml \
            --capital "${{ inputs.capital }}"

      - name: Run scanner (real NSE data)
        if: ${{ inputs.data_source == 'real_nse' }}
        run: |
          python scanner/scanner.py \
            --config config/screening_config.real.yaml \
            --capital "${{ inputs.capital }}"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: output/scan_results.csv
          if-no-files-found: warn

      - name: Upload fetched real data (for debugging column-mapping issues)
        if: ${{ inputs.data_source == 'real_nse' }}
        uses: actions/upload-artifact@v4
        with:
          name: nse-raw-data
          path: data/real/
          if-no-files-found: warn
